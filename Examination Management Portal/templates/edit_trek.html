<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Trek</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>

<body>

    <div id="page">

        <div id="page_titel">

            <h1>Edit Trek</h1>

            <form action="{{ url_for('customer_dashboard', customer_id=customer_id) }}" method="GET">

                <button
                    type="submit"
                    class="btn btn-primary">
                    Back
                </button>

            </form>

        </div>

        <div id="book_trek">

            <form action="{{ url_for('edit_trek', customer_id=customer_id, place_id=place.id) }}" method="POST">

                <div class="mb-3">

                    <label class="form-label">Place Name</label><br>

                    <input
                        type="text"
                        class="form-control"
                        name="place"
                        value="{{ place.place_name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Days</label><br>

                    <input
                        type="number"
                        class="form-control"
                        name="days"
                        value="{{ place.total_days }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">People Count</label><br>

                    <input
                        type="number"
                        class="form-control"
                        name="people_count"
                        value="{{ place.no_of_people }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Starting Date</label><br>

                    <input
                        type="date"
                        class="form-control"
                        name="start_date"
                        value="{{ place.starting_date }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Ending Date</label><br>

                    <input
                        type="date"
                        class="form-control"
                        name="end_date"
                        value="{{ place.ending_date }}"
                        required>

                </div>

                <div id="register_button">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Update Trek

                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
