
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Examiner Register</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous">
</head>

<body>
    <div id="page">

        <form action="/examiner_register" method="POST">

            <div id="page_titel">
                <h1>EXAMINER REGISTRATION</h1>
            </div>

            <div id="Register2">

                <div class="mb-3">
                    <label for="email_input" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email_input"
                        placeholder="name@example.com" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="password_input" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password_input"
                        name="password" required>
                </div>

                <div class="mb-3">
                    <label for="name_input" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name_input"
                        placeholder="Enter your full name" name="full_name" required>
                </div>

                <div class="mb-3">
                    <label for="username_input" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username_input"
                        placeholder="Enter your username" name="username" required>
                </div>

                <div class="mb-3">
                    <label for="department_input" class="form-label">Department</label>
                    <input type="text" class="form-control" id="department_input"
                        placeholder="Enter your department" name="department" required>
                </div>

                <div id="register_button">
                    <button type="submit" class="btn btn-primary">
                        Register
                    </button>
                </div>

            </div>
        </form>

    </div>
</body>
</html>
