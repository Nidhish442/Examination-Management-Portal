<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div id="b">
       <div id="page_title2">
        <div id="login1">
            <h1>Login</h1><br>
            <form action = "/login" method="post">
            <div class="mb-3">
                <label for="email_input" class="form-label">Email address</label><br>
                <input type="email" class="form-control" id="email_input" placeholder="name@example.com" name="email">
            </div>

            <div class="mb-3">
                <label for="password_input" class="form-label">Password</label>
                <input type="password" class="form-control" id="password_input" name="password">
            </div>
            <div id="login_button">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>


        </div>
    </div>
    
</body>
</html>
